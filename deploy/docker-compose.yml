# Production: runs on the talespinner.io server behind the shared Traefik.
# IMAGE_REPO, IMAGE_TAG and APP_DOMAIN come from the .env the deploy workflow writes next to this file.
services:
  web:
    image: ${IMAGE_REPO}/site:${IMAGE_TAG:-latest}
    restart: always
    networks:
      - traefik-wingedsheep
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-wingedsheep
      - traefik.http.routers.wingedsheep-web.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)
      - traefik.http.routers.wingedsheep-web.entrypoints=websecure
      - traefik.http.routers.wingedsheep-web.tls=true
      - traefik.http.routers.wingedsheep-web.tls.certresolver=lets-encrypt
      # Outrank the old Ghost router for the same host while both are running
      - traefik.http.routers.wingedsheep-web.priority=1000
      - traefik.http.routers.wingedsheep-web.middlewares=wingedsheep-web-www
      - traefik.http.middlewares.wingedsheep-web-www.redirectregex.regex=^https://www\.(.*)
      - traefik.http.middlewares.wingedsheep-web-www.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.wingedsheep-web-www.redirectregex.permanent=true
      - traefik.http.services.wingedsheep-web.loadbalancer.server.port=80

networks:
  traefik-wingedsheep:
    external: true
