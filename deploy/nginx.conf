server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Traefik terminates TLS; keep redirects relative so they stay on https
    absolute_redirect off;

    # the build leaves a .gz (squeezed hard, once) beside everything worth it; anything without
    # one is compressed on the way out
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml application/rss+xml text/xml text/plain image/svg+xml model/gltf-binary;

    # fingerprinted build output never changes
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/headers.conf;
    }

    # the models go hand in hand with the code and island.json, so always revalidate them
    # (a 304 when nothing changed); a stale island.glb next to new code draws garbage
    location ^~ /models/ {
        # nginx doesn't know .glb, and as octet-stream it wouldn't be compressed
        types {
            model/gltf-binary glb;
            application/json json;
            image/png png;
        }
        add_header Cache-Control "no-cache";
        include /etc/nginx/headers.conf;
    }

    # audio, fonts and images: cache, but let a redeploy win within a week
    location ~* \.(glb|png|webp|jpe?g|gif|svg|woff2|m4a|webm|mp3|mp4)$ {
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/headers.conf;
    }

    # pages and version.txt: always revalidate so a deploy shows up right away
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/headers.conf;
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
}
