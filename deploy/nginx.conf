server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Traefik terminates TLS; keep redirects relative so they stay on https
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml model/gltf-binary;

    # fingerprinted build output never changes
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # models, audio, fonts and images: cache, but let a redeploy win within a week
    location ~* \.(glb|png|webp|jpe?g|gif|svg|woff2|m4a|webm|mp3|mp4)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
}
